name: Causal ledger regressions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Cross-language parity and invariants
        run: node tests/test_core.mjs
      - name: Independent Pandas rolling indicators
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python pandas_reference.py --input /tmp/paperline-fixture.json --as-of 1700648000 > /tmp/pandas-parity.json
